# SonarQube Cloud automatic analysis reads this file from the default branch.
# Analyze tests/ as test code, so fixture-only constructs (the integration
# images run as root to install Cacti and bind port 80) are not reported as
# production findings, while the plugin code stays in scope.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
sonar.php.coverage.reportPaths=coverage/clover.xml
