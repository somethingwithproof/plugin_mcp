name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      PHP_IMAGE: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP syntax
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/app:ro" --workdir /app "$PHP_IMAGE" \
            sh -c "find . -name '*.php' -print0 | xargs -0 -n1 php -l"
      - name: Registry, lifecycle, and native provider tests
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/app:ro" --workdir /app "$PHP_IMAGE" \
            sh -eu -c '
              php tests/registry.php
              php tests/lifecycle.php
              php tests/providers.php
              php tests/realm.php
              php tests/aip.php
              php tests/storage.php
              php tests/bootstrap.php
              php tests/api.php
              php tests/contract.php
              php tests/origin.php
              php tests/mcp.php
              php tests/admin.php
              php tests/self_service.php
            '

  quality:
    name: PHPStan & PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer phpstan
      - name: Run PHPUnit tests
        run: composer test

  package:
    name: Build installable plugin archive
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inspect archive
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=mcp/ HEAD > dist/mcp.tar.gz
          mkdir /tmp/mcp-package
          tar -xzf dist/mcp.tar.gz -C /tmp/mcp-package
          test -f /tmp/mcp-package/mcp/INFO
          test -f /tmp/mcp-package/mcp/setup.php
          test -f /tmp/mcp-package/mcp/images/mcp_logo.png
          test ! -d /tmp/mcp-package/mcp/tests
          test ! -d /tmp/mcp-package/mcp/.github
          cd dist
          sha256sum mcp.tar.gz > SHA256SUMS
      - name: Upload plugin archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-plugin
          path: dist/*
          if-no-files-found: error
