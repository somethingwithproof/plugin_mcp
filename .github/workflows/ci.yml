name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      PHP_IMAGE: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP syntax
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/app:ro" --workdir /app "$PHP_IMAGE" \
            sh -c "find . -name '*.php' -print0 | xargs -0 -n1 php -l"
      - name: Registry, lifecycle, and native provider tests
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/app:ro" --workdir /app "$PHP_IMAGE" \
            sh -eu -c '
              php tests/registry.php
              php tests/lifecycle.php
              php tests/providers.php
              php tests/realm.php
              php tests/aip.php
              php tests/storage.php
              php tests/bootstrap.php
              php tests/api.php
              php tests/contract.php
              php tests/origin.php
              php tests/mcp.php
              php tests/admin.php
              php tests/self_service.php
            '

  quality:
    name: PHPStan & PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
      - run: composer install --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer phpstan
      - name: Run PHPUnit tests
        if: matrix.php != '8.4'
        run: composer test
      - name: Run PHPUnit tests with coverage
        if: matrix.php == '8.4'
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --configuration=phpunit.xml --coverage-clover=coverage/clover.xml
      - name: Enforce 85% line coverage threshold
        if: matrix.php == '8.4'
        run: |
          php -r '
            $xml = simplexml_load_file("coverage/clover.xml");
            if ($xml === false || !isset($xml->project->metrics)) {
              fwrite(STDERR, "Unable to parse coverage/clover.xml\n");
              exit(1);
            }
            $m = $xml->project->metrics;
            $statements = (int) $m["statements"];
            $covered = (int) $m["coveredstatements"];
            $pct = $statements > 0 ? ($covered / $statements) * 100.0 : 0.0;
            printf("Measured line coverage: %.2f%% (%d/%d statements)\n", $pct, $covered, $statements);
            if ($pct < 85.0) {
              fwrite(STDERR, sprintf("Coverage %.2f%% is below required 85.00%% threshold\n", $pct));
              exit(1);
            }
          '
      - name: Upload coverage report
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpunit-coverage-clover
          path: coverage/clover.xml
          if-no-files-found: error
      - name: SonarCloud Scan
        if: matrix.php == '8.4' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Build installable plugin archive
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inspect archive
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=mcp/ HEAD > dist/mcp.tar.gz
          mkdir /tmp/mcp-package
          tar -xzf dist/mcp.tar.gz -C /tmp/mcp-package
          test -f /tmp/mcp-package/mcp/INFO
          test -f /tmp/mcp-package/mcp/setup.php
          test -f /tmp/mcp-package/mcp/schema/mcp.schema.yaml
          test -f /tmp/mcp-package/mcp/scripts/ss_mcp_stats.php
          test -f /tmp/mcp-package/mcp/images/mcp_logo.png
          test ! -d /tmp/mcp-package/mcp/tests
          test ! -d /tmp/mcp-package/mcp/.github
          cd dist
          sha256sum mcp.tar.gz > SHA256SUMS
      - name: Upload plugin archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-plugin
          path: dist/*
          if-no-files-found: error

  cacti-smoke:
    name: Cacti 1.2.31 / PHP 8.4 / MariaDB 11.8 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_PWD: cactiuser
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: cactiroot
          MARIADB_DATABASE: cacti
          MARIADB_USER: cactiuser
          MARIADB_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Cacti/cacti
          ref: release/1.2.31
          path: cacti

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cacti/plugins/mcp

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, gd, gmp, intl, ldap, mbstring, openssl, pcntl, pdo_mysql, posix, sockets, xml, zlib
          ini-values: memory_limit=256M, max_execution_time=60, date.timezone=UTC

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mariadb-client

      - name: Initialize Cacti database
        env:
          MYSQL_PWD: cactiroot
        run: |
          cp include/config.php.dist include/config.php
          sed -i "s/\$database_hostname[[:space:]]*= 'localhost'/\$database_hostname = '127.0.0.1'/" include/config.php
          mariadb -h127.0.0.1 -uroot -e "ALTER DATABASE cacti CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mariadb -h127.0.0.1 -uroot cacti < cacti.sql
          php -r "chdir('${GITHUB_WORKSPACE}/cacti'); include './include/cli_check.php'; db_execute_prepared('UPDATE version SET cacti = ?', ['1.2.31']);"
        working-directory: cacti

      - name: Install and enable plugin_mcp
        run: |
          php cli/plugin_manage.php --plugin=mcp --install --enable --allperms
          test "$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT status FROM plugin_config WHERE directory='mcp';")" -eq 1
          test "$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT COUNT(*) FROM plugin_hooks WHERE name='mcp' AND status=1;")" -eq 7
          test "$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT COUNT(*) FROM plugin_realms WHERE plugin='mcp';")" -eq 2
        working-directory: cacti

      - name: Smoke test token CLI, script-server metrics, and integration hooks
        run: |
          mariadb -h127.0.0.1 -ucactiuser cacti -e "REPLACE INTO settings (name, value) VALUES ('auth_method', '1'), ('mcp_public_url', 'http://localhost/cacti');"
          API_REALM_ID="$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT id + 100 FROM plugin_realms WHERE plugin='mcp' AND file LIKE '%api.php%';")"
          ADMIN_ID="$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT id FROM user_auth WHERE username='admin';")"
          mariadb -h127.0.0.1 -ucactiuser cacti -e "REPLACE INTO user_auth_realm (realm_id, user_id) VALUES (${API_REALM_ID}, ${ADMIN_ID});"
          TOKEN_VALUE="cmcp_pat_$(openssl rand -hex 32)"
          TOKEN_OUT="$(CACTI_MCP_TOKEN="$TOKEN_VALUE" php plugins/mcp/tokens.php --create=admin --days=1)"
          unset TOKEN_VALUE
          echo "$TOKEN_OUT" | grep -Eq '^Created token ID [0-9]+$'
          TOKEN_ID="$(echo "$TOKEN_OUT" | awk '{print $NF}')"
          php plugins/mcp/tokens.php --list | php -r '
            $rows = json_decode(stream_get_contents(STDIN), true);
            if (!is_array($rows) || count($rows) < 1) { fwrite(STDERR, "Expected token list JSON\n"); exit(1); }
            $found = false;
            foreach ($rows as $row) {
              if ((int) ($row["id"] ?? 0) === (int) $argv[1] && (int) ($row["user_id"] ?? 0) === (int) $argv[2] && (int) ($row["revoked"] ?? 1) === 0) {
                $found = true;
                break;
              }
            }
            if (!$found) { fwrite(STDERR, "Created token missing from tokens.php --list\n"); exit(1); }
          ' "$TOKEN_ID" "$ADMIN_ID"

          STATS="$(php plugins/mcp/scripts/ss_mcp_stats.php)"
          echo "Script server stats: $STATS"
          echo "$STATS" | grep -Eq '^abilities_total:9 abilities_enabled:9 active_tokens:1 audit_events_24h:[0-9]+ capability_blocks:0$'

          php -r '
            chdir($argv[1]);
            include "./include/cli_check.php";
            require_once "./plugins/mcp/setup.php";
            $checks = mcp_doctor_register_checks(["mode" => "run"]);
            if (count($checks) !== 3) { fwrite(STDERR, "Expected 3 Doctor checks\n"); exit(1); }
            foreach ($checks as $c) {
              if ($c["status"] !== "ok") { fwrite(STDERR, "Check failed: " . $c["id"] . "\n"); exit(1); }
            }
            $debug = mcp_doctor_register_debug_info();
            if (count($debug) !== 1 || $debug[0]["fields"]["schema_tables_present"]["value"] !== true) {
              fwrite(STDERR, "Unexpected debug info payload\n"); exit(1);
            }
            $export = mcp_casc_export();
            if (($export["config"]["mcp_public_url"] ?? "") !== "http://localhost/cacti") {
              fwrite(STDERR, "Unexpected CasC export\n"); exit(1);
            }
          ' "${GITHUB_WORKSPACE}/cacti"

          php plugins/mcp/tokens.php --revoke="$TOKEN_ID"
          STATS_AFTER="$(php plugins/mcp/scripts/ss_mcp_stats.php)"
          echo "$STATS_AFTER" | grep -Eq '^abilities_total:9 abilities_enabled:9 active_tokens:0 audit_events_24h:[0-9]+ capability_blocks:0$'
        working-directory: cacti

      - name: Verify disable, uninstall token revocation, and reinstall lifecycle
        run: |
          php cli/plugin_manage.php --plugin=mcp --disable
          php cli/plugin_manage.php --plugin=mcp --uninstall
          test "$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT COUNT(*) FROM plugin_config WHERE directory='mcp';")" -eq 0
          test "$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT COUNT(*) FROM plugin_mcp_token WHERE revoked = 0;")" -eq 0
          php cli/plugin_manage.php --plugin=mcp --install --enable
          test "$(mariadb -N -h127.0.0.1 -ucactiuser cacti -e "SELECT status FROM plugin_config WHERE directory='mcp';")" -eq 1
        working-directory: cacti
